spring:
  application:
    name: hospital-queue

  datasource:
    url: jdbc:postgresql://localhost:5432/hospitalqueue
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        default_batch_fetch_size: 16

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      timeout: 500ms
      connect-timeout: 500ms

  flyway:
    enabled: true

  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"

# Booking settings
app:
  booking:
    # Convenience fee charged per booked token, in paise (1000 paise = Rs 10).
    convenience-fee-paise: 1000
    # How long a patient's checkout holds a token while they pay, in seconds (900 = 15 minutes).
    hold-seconds: 900

  payment:
    # DEVELOPMENT ONLY. Enables the fake payment callback endpoint, which lets anyone mark a checkout as paid.
    # Remove this line (or set it to false) in every real deployment; the real gateway webhook replaces it.
    stub-enabled: true

  queue:
    # Average consultation length in minutes. Waiting-time estimates are "patients ahead" times this value.
    average-consultation-minutes: 10

  security:
    # AES-256 key (Base64, exactly 32 bytes) used to encrypt clinical text before it is stored.
    # The default below is a DEVELOPMENT key that is public in this file. Every real deployment must set the
    # environment variable FIELD_ENCRYPTION_KEY from a secret manager; losing the key means losing the data.
    field-encryption-key: ${FIELD_ENCRYPTION_KEY:aG9zcGl0YWwtcXVldWUtREVWLU9OTFkta2V5LTAwMDA=}
